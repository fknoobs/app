name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # Called from Release after the Version Packages PR is merged and tagged.
  # GITHUB_TOKEN tag pushes do not trigger this workflow on their own.
  workflow_call:

# Do not use github.workflow here: in a workflow_call it is the caller name
# ("Release"), which would share Release-refs/heads/master with the parent
# and GitHub cancels both as a deadlock.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
            updaterJsonPreferNsis: true
          - platform: ubuntu-22.04
            args: --bundles appimage
            updaterJsonPreferNsis: false
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libx11-dev libxtst-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Authenticode via Azure Artifact Signing. Inert until AZURE_CLIENT_ID is set.
      # Secrets: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID
      # Variables: AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT
      # Optional variable: AZURE_SIGNING_PROFILE (defaults to coh1stats)
      - name: Enable Windows Authenticode signing
        id: codesign
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID) {
            Write-Host "Skipping Authenticode signing; AZURE_CLIENT_ID is not set."
            echo 'enabled=false' >> $env:GITHUB_OUTPUT
            echo 'args=' >> $env:GITHUB_OUTPUT
            return
          }
          foreach ($name in @('AZURE_CLIENT_SECRET', 'AZURE_TENANT_ID', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name" -ErrorAction SilentlyContinue).Value)) {
              throw "$name is required when AZURE_CLIENT_ID is set."
            }
          }
          $profile = if ($env:AZURE_SIGNING_PROFILE) { $env:AZURE_SIGNING_PROFILE } else { 'coh1stats' }
          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'signtool.exe') } |
            Select-Object -First 1
          if (-not $sdkBin) {
            throw 'signtool.exe not found. Install a Windows 10/11 SDK on the runner.'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Levminer/artifact-signing-cli/releases/download/0.11.0/artifact-signing-cli.exe' -OutFile (Join-Path $tools 'artifact-signing-cli.exe')
          $endpoint = $env:AZURE_SIGNING_ENDPOINT.TrimEnd('/')
          $signCommand = "artifact-signing-cli -e $endpoint -a $($env:AZURE_SIGNING_ACCOUNT) -c $profile -d `"Company of Heroes - Companion`" %1"
          $overlay = @{ bundle = @{ windows = @{ signCommand = $signCommand } } } | ConvertTo-Json -Depth 5
          Set-Content -Path 'packages/app/src-tauri/tauri.codesign.conf.json' -Value $overlay -Encoding utf8
          echo $sdkBin >> $env:GITHUB_PATH
          echo $tools >> $env:GITHUB_PATH
          echo 'enabled=true' >> $env:GITHUB_OUTPUT
          echo 'args= --config src-tauri/tauri.codesign.conf.json' >> $env:GITHUB_OUTPUT
          Write-Host "Authenticode signing enabled ($endpoint / $($env:AZURE_SIGNING_ACCOUNT) / $profile)"

      - name: Setup .NET
        if: steps.codesign.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: packages/app
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}${{ steps.codesign.outputs.args }}
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: See the changelog in the app or on GitHub.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: ${{ matrix.updaterJsonPreferNsis }}
